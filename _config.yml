title: Davis Reina-Guerra
description: PhD candidate in the Boston University department of Anatomy and Neurobiology Wallace Lab, studying the representation of threat/reward conflict by topographically organized basal ganglia subcircuits using a combination of genetic neuroanatomical tract tracing and loss-of-function behavioral approaches coupled with optical interrogation of circuit activity. Experienced educator in the biomedical sciences in both lecture and laboratory setting across a wide variety of student populations.  Skilled cadaveric dissector for medical research and education. Passionate illustrator and graphic designer.

